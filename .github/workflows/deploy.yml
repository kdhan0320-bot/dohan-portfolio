name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies (Mini SNS)
        working-directory: lecture1/mini-sns
        run: npm ci

      - name: Build Mini SNS
        working-directory: lecture1/mini-sns
        env:
          NODE_ENV: production
        run: |
          npm run lint
          npm run build

      - name: Install dependencies (Portfolio)
        working-directory: lecture1/portfolio
        run: npm ci

      - name: Build Portfolio
        working-directory: lecture1/portfolio
        run: |
          npm run lint
          npm run build

      - name: Install dependencies (Pumuiseon)
        working-directory: lecture1/pumuiseon
        run: npm ci

      - name: Build Pumuiseon
        working-directory: lecture1/pumuiseon
        run: |
          npm run lint
          npm run build

      - name: Install dependencies (Galpirok)
        working-directory: lecture1/galpirok
        run: npm ci

      - name: Build Galpirok
        working-directory: lecture1/galpirok
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NODE_ENV: production
        run: |
          npm run lint
          npm run build

      - name: Verify existing application rules
        run: |
          node --test lecture1/pumuiseon/tests/*.test.mjs
          node --test lecture1/galpirok/tests/*.test.mjs

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -r lecture1/mini-sns/dist/. _site/mini-sns
          cp _site/mini-sns/index.html _site/mini-sns/404.html
          cp -r lecture1/portfolio/dist/. _site/my-portfolio
          cp _site/my-portfolio/index.html _site/my-portfolio/404.html
          cp -r lecture1/pumuiseon/dist/. _site/pumuiseon
          cp _site/pumuiseon/index.html _site/pumuiseon/404.html
          mkdir -p _site/portfolio-feedback-hub _site/my-community
          for legacy in portfolio-feedback-hub my-community; do
            cp lecture1/pumuiseon/legacy-my-community-redirect.html "_site/$legacy/index.html"
            cp lecture1/pumuiseon/legacy-my-community-redirect.html "_site/$legacy/404.html"
          done
          cp -r lecture1/galpirok/dist/. _site/galpirok
          cp _site/galpirok/index.html _site/galpirok/404.html
          mkdir -p _site/jobflow-dashboard/assets
          cp lecture1/galpirok/legacy-jobflow-redirect.html _site/jobflow-dashboard/index.html
          cp lecture1/galpirok/legacy-jobflow-redirect.html _site/jobflow-dashboard/404.html
          # Cached old HTML can detect the new release and reach the redirect.
          cp lecture1/galpirok/dist/release.json _site/jobflow-dashboard/release.json
          cp lecture1/galpirok/dist/assets/index-B1ncJhLB.js lecture1/galpirok/dist/assets/index-lnYHg2Gk.js _site/jobflow-dashboard/assets/
          mkdir -p _site/jansang-cinema _site/ott-service
          cp lecture1/jansang-cinema/index.html _site/jansang-cinema/
          cp -r lecture1/jansang-cinema/assets lecture1/jansang-cinema/css lecture1/jansang-cinema/js _site/jansang-cinema/
          cp lecture1/jansang-cinema/legacy-ott-service-redirect.html _site/ott-service/index.html
          cp lecture1/jansang-cinema/legacy-ott-service-redirect.html _site/ott-service/404.html
          # Keep assets reachable for previously cached HTML during the URL transition.
          cp -r lecture1/jansang-cinema/assets lecture1/jansang-cinema/css lecture1/jansang-cinema/js _site/ott-service/
          mkdir -p _site/gijunseon
          cp lecture1/gijunseon/*.html _site/gijunseon/
          cp -r lecture1/gijunseon/assets lecture1/gijunseon/css lecture1/gijunseon/js _site/gijunseon/
          mkdir -p _site/gongjeongbom
          cp lecture1/gongjeongbom/*.html _site/gongjeongbom/
          cp -r lecture1/gongjeongbom/assets lecture1/gongjeongbom/css lecture1/gongjeongbom/js _site/gongjeongbom/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
