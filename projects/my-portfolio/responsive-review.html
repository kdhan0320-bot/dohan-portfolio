<!doctype html><html lang="ko"><meta charset="utf-8"><title>포트폴리오 반응형 검수</title><style>body{margin:20px;background:#dededb;font:14px sans-serif}nav{display:flex;gap:12px;align-items:center;position:sticky;top:0;background:#dededb;padding:8px;z-index:2}select,button{padding:10px;font:inherit}iframe{display:block;border:1px solid #aaa;margin-top:15px;background:#f7f5eb}</style><nav><label>검수 폭 <select id="width"><option>320</option><option selected>390</option><option>768</option><option>1024</option><option>1440</option><option>2560</option><option>3840</option></select></label><label>페이지 <select id="route"><option value="/">홈</option><option value="/projects">전체 작업</option><option value="/about">소개</option><option value="/projects/feedback-hub">품의선</option><option value="/projects/ott-service">잔상관</option><option value="/projects/jobflow">갈피록</option><option value="/projects/seolbiit">설비결</option><option value="/projects/gongjeongbom">기준선</option><option value="/projects/bus-arrival">온정류</option><option value="/projects/brewstep">소요빛</option><option value="https://kdhan0320-bot.github.io/dohan-portfolio/portfolio-feedback-hub/">품의선 공개 웹</option><option value="https://kdhan0320-bot.github.io/dohan-portfolio/jobflow-dashboard/#/welcome">갈피록 공개 웹</option><option value="https://kdhan0320-bot.github.io/dohan-portfolio/ott-service/">잔상관 공개 웹</option></select></label><span>반응형 배치용 iframe · 실제 기기 검증 아님</span></nav><iframe title="포트폴리오 검수 화면" id="preview" width="390" height="780" src="./#/"></iframe><script>const frame=document.getElementById('preview');document.getElementById('width').onchange=e=>frame.width=e.target.value;document.getElementById('route').onchange=e=>frame.src=e.target.value.startsWith('https:')?e.target.value:'./#'+e.target.value;</script></html>
