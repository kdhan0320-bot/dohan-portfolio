<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://kdhan0320-bot.github.io/dohan-portfolio/pumuiseon/" />
    <title>품의선 새 주소로 이동</title>
    <noscript><meta http-equiv="refresh" content="0; url=/dohan-portfolio/pumuiseon/" /></noscript>
  </head>
  <body>
    <p>품의선의 새 주소로 이동합니다. <a id="destination" href="/dohan-portfolio/pumuiseon/">이동하지 않으면 여기를 눌러주세요.</a></p>
    <script>
      // Keep bookmarked detail routes and filters on the same origin.
      const destination = new URL('/dohan-portfolio/pumuiseon/', window.location.origin);
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      document.getElementById('destination').href = destination.href;
      window.location.replace(destination.href);
    </script>
  </body>
</html>
